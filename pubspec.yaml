name: camovies
description: "A professional Flutter project template with clean architecture"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.7
  provider: ^6.1.2

  # Dependency Injection
  get_it: ^7.6.7
  injectable: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Network
  dio: ^5.4.1
  connectivity_plus: ^5.0.2
  http: ^1.2.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utils
  logger: ^2.0.2+1
  intl: ^0.20.2
  path_provider: ^2.1.2
  url_launcher: ^6.2.4
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.2

  # UI Components
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  lottie: ^3.0.0
  bloc: ^8.1.4
  google_fonts: ^6.2.1
  video_player: ^2.8.1

  # Firebase (Optional, uncomment if needed)
  # firebase_core: ^2.25.4
  # firebase_auth: ^4.17.4
  # firebase_messaging: ^14.7.15
  # firebase_analytics: ^10.8.5
  # cloud_firestore: ^4.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  injectable_generator: ^2.4.1
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
